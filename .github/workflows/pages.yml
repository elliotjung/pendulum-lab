name: Deploy verified build to GitHub Pages

on:
  workflow_run:
    workflows: [Mainline Full Validation]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  # Serialize production deployment so an older workflow cannot overtake a
  # newer validated commit.
  group: pages-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  stage-validated-artifact:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master') &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' ||
      github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Mainline already built this artifact, ran the scientific gates, and
      # exercised the same bytes in Chromium/Firefox/WebKit/mobile. Download
      # that exact artifact instead of rebuilding and retesting a second time.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mainline-validated-build
          path: validated
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Verify the validated commit is still the branch tip
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_BRANCH: ${{ github.event.workflow_run.head_branch }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${VALIDATED_BRANCH}" --jq .sha)"
          test "$VALIDATED_SHA" = "$current_sha"
      - name: Confirm the validated Pages entrypoint exists
        shell: bash
        run: test -s validated/dist/index.html
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: validated/dist

  deploy:
    needs: stage-validated-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the exact artifact that passed Mainline Full Validation
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
