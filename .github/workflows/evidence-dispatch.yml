name: Evidence Dispatch

# Structural fix for cross-repo evidence drift: whenever the committed
# evidence summary changes on the default branch, tell the landing repo so its
# evidence-sync workflow can pull, re-verify, and auto-commit the new summary.
# Releases additionally dispatch `pendulum-release` from release.yml; this
# lane covers the ordinary between-release cadence.

on:
  push:
    branches: [main, master]
    paths:
      - reports/evidence-summary.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-dispatch
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Notify landing evidence sync
        env:
          LANDING_DISPATCH_TOKEN: ${{ secrets.LANDING_DISPATCH_TOKEN }}
        shell: bash
        run: |
          if [ -z "$LANDING_DISPATCH_TOKEN" ]; then
            printf '## Evidence dispatch: blocked\n\n`LANDING_DISPATCH_TOKEN` is required; no synchronization was claimed.\n' >> "$GITHUB_STEP_SUMMARY"
            echo "LANDING_DISPATCH_TOKEN is required; landing evidence sync did not run." >&2
            exit 1
          fi
          evidence_source_commit="$(node -e "const r=require('./reports/evidence-summary.json'); const p=r?.provenance; const t=r?.tests; const v=p?.sourceCommit; if(t?.failed!==0) throw new Error('refusing to dispatch evidence with failed tests'); if(t?.passed!==t?.total) throw new Error('refusing to dispatch incomplete test evidence'); if(t?.success!==true) throw new Error('refusing to dispatch unsuccessful test evidence'); if(!/^[0-9a-f]{40}$/i.test(v)) throw new Error('evidence sourceCommit must be a full Git SHA'); if(p?.dirtyWorktree!==false) throw new Error('refusing to dispatch evidence generated from a dirty worktree'); const expiry=Date.parse(p?.expiresAt??''); if(!Number.isFinite(expiry)||expiry<=Date.now()) throw new Error('refusing to dispatch expired evidence'); process.stdout.write(v)")"
          curl --fail-with-body --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $LANDING_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/elliotjung/pendulum-landing/dispatches \
            -d "{\"event_type\":\"evidence-updated\",\"client_payload\":{\"source_commit\":\"$evidence_source_commit\",\"pushed_commit\":\"$GITHUB_SHA\"}}"
          printf '## Evidence dispatch: sent\n\nLanding synchronization was requested for `%s`.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
