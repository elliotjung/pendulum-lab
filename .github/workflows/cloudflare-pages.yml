name: Cloudflare Pages mirror

on:
  # The mirror is optional and credentialed. An explicit dispatch fails closed
  # when configuration is missing without making every GitHub Pages push red.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: cloudflare-pages
    steps:
      - name: Require an explicitly configured mirror
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_MIRROR_URL: ${{ vars.CLOUDFLARE_MIRROR_URL }}
        shell: bash
        run: |
          missing=()
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing+=(CLOUDFLARE_API_TOKEN)
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          [ -n "$CLOUDFLARE_MIRROR_URL" ] || missing+=(CLOUDFLARE_MIRROR_URL)
          if [ "${#missing[@]}" -ne 0 ]; then
            printf '## Cloudflare mirror: blocked\n\nMissing configuration: `%s`.\n' "${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
            echo "Cloudflare mirror is required but not configured: ${missing[*]}" >&2
            exit 1
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-project
        with:
          node-version: 24
      - run: npm run audit:deps
      - run: npm run verify
      - name: Reject unexpected tracked rewrites from verification
        shell: bash
        run: git diff --exit-code
      - run: npm run build:lib
      - run: npm run build
      - name: Deploy the COOP/COEP-enabled mirror
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          npm exec --no -- wrangler pages deploy dist --project-name pendulum-lab --branch "${GITHUB_REF_NAME}"
      - name: Verify deployed isolation and security headers
        env:
          DEPLOYMENT_URL: ${{ vars.CLOUDFLARE_MIRROR_URL }}
        run: npm run release:verify-deployment -- --profile isolated --attempts 5
      - name: Preserve live deployment security evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloudflare-deployment-security
          path: reports/deployment-security.json
          if-no-files-found: error
          retention-days: 90
