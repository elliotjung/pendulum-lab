name: Mainline Full Validation

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mainline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  science-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-project
      - run: npm run audit:deps
      - run: npm run verify
      - name: Reject unexpected tracked rewrites from verification
        shell: bash
        run: git diff --exit-code
      # The kernel manifest writer rejects dirty source trees. Stamp and verify
      # the exact source SHA before coverage and report producers rewrite tracked
      # evidence files; the generated kernel directory itself is ignored.
      - name: Build and verify the authoritative Landing demo kernel
        run: npm run landing:kernel:build && npm run landing:kernel:check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lab-built-landing-kernel
          path: reports/landing-kernel/
          if-no-files-found: error
          retention-days: 90
      - run: npm run test:slow
      - run: npm run test:coverage
      - run: npm run audit:legacy
      - run: npm run audit:mojibake:strict
      - run: npm run reports
      - run: npm run validate:gpu-scale
      # The standalone manifest pins exact bytes. Build it from the committed
      # deterministic benchmark input under the repository-pinned Node runtime;
      # the fresh wall-clock benchmark is intentionally produced only afterward.
      - run: npm run build:standalone
      # Committed standalone bundle must match what the current source builds.
      - run: npm run check:standalone-sync
      - run: npm run benchmark:energy
      # The hosted build intentionally includes the fresh mainline benchmark.
      - run: npm run build
      # Same drift contract for the committed WASM ensemble kernel.
      - run: npm run check:wasm-sync
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trusted-wasm-sync
          path: |
            src/runtime/wasm/pendulum-kernel.wasm
            reports/wasm-sync.json
          if-no-files-found: error
          retention-days: 90
      - run: npm run build:lib
      - run: npm run budget
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: bundle-budget
          path: reports/bundle-budget.*
          if-no-files-found: error
      - run: npm run docs:api
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm run notebook:validate
      - name: Hand the exact validated build to browser and release checks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mainline-build-candidate
          path: |
            dist/
            dist-lib/
            standalone/
            documents/api/
            reports/
          if-no-files-found: error
          retention-days: 2

  browser-and-release-validation:
    needs: science-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-node-project
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.lock
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mainline-build-candidate
          path: .
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Audit CSS selector coverage
        shell: bash
        run: |
          npm run preview -- --port 4173 > /tmp/pendulum-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent --connect-timeout 2 --max-time 5 http://127.0.0.1:4173/app.html >/dev/null && break
            [ "$attempt" -lt 30 ] || { cat /tmp/pendulum-preview.log; exit 1; }
            sleep 1
          done
          npm run audit:css-coverage
      - name: Ensure PDF visual-verification renderer is available
        shell: bash
        run: |
          set -euo pipefail
          have_poppler_tools() {
            command -v pdftoppm >/dev/null && command -v pdfinfo >/dev/null
          }

          if have_poppler_tools; then
            echo "Poppler PDF validation tools are already available."
          else
            for attempt in 1 2 3; do
              echo "Installing Poppler PDF validation tools (attempt ${attempt}/3)."
              if timeout --kill-after=15s 90s sudo -n apt-get -o Acquire::Retries=3 update && \
                timeout --kill-after=15s 90s sudo -n env DEBIAN_FRONTEND=noninteractive \
                  apt-get -o Acquire::Retries=3 install -y --no-install-recommends poppler-utils && \
                have_poppler_tools; then
                break
              fi

              if [ "$attempt" -eq 3 ]; then
                echo "Poppler tools are unavailable after three bounded installation attempts." >&2
                exit 1
              fi
              sleep "$((attempt * 5))"
            done
          fi

          have_poppler_tools
      # Exercise the actual double-click/file:// path, including the explicit
      # worker-fallback notice shown when module workers are unavailable.
      - run: npm run smoke:standalone
      # Single-build profile (median of 5 samples + environment metadata).
      # Honest A/B comparison against the merge-base runs on PRs (ci.yml
      # benchmark-compare); mainline keeps the longitudinal memory gate below.
      - run: npm run benchmark
      - run: npm run benchmark:wasm-nchain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: css-and-wasm-diagnostics
          path: |
            reports/css-coverage.*
            reports/wasm-nchain-baseline.json
          if-no-files-found: error
      # Memory regression is a HARD gate: min(50 MB absolute, 20% relative)
      # growth over the committed baseline (reports/memory-baseline.json).
      - run: npm run benchmark:memory
        env:
          MEMORY_FAIL_ON_REGRESSION: ${{ hashFiles('reports/memory-baseline.json') != '' && '1' || '0' }}
      - run: npm run flagship:certify
      - run: npm run flagship:external
      # Mainline browser suite: smoke, accessibility, research workspace,
      # Trust Inspector, and long-run performance coverage.
      - run: npm run test:e2e:mainline
        env:
          PLAYWRIGHT_USE_PREVIEW: '1'
      # Chromium exposes the service-worker registration/update handles needed
      # to prove the built artifact's offline and waiting-update lifecycle.
      - run: npm run test:e2e:pwa
      - run: npx playwright test e2e/main-canvas-worker.spec.ts --project=chromium
        env:
          PLAYWRIGHT_USE_PREVIEW: '1'
      # Cross-engine smoke keeps Firefox/WebKit/mobile startup covered without
      # multiplying every long-running research UI spec across all engines.
      - run: npx playwright test e2e/smoke.spec.ts e2e/audience-mode.spec.ts e2e/cross-engine-resource-pressure.spec.ts --project=firefox --project=webkit --project=mobile-chrome
        env:
          PLAYWRIGHT_USE_PREVIEW: '1'
      # iPhone-shaped WebKit coverage pins both startup and the project's
      # reviewer-facing Trust Inspector popover on a narrow touch viewport.
      - run: npx playwright test e2e/smoke.spec.ts e2e/audience-mode.spec.ts e2e/trust-inspector.spec.ts e2e/cross-engine-resource-pressure.spec.ts --project=mobile-webkit
        env:
          PLAYWRIGHT_USE_PREVIEW: '1'
      - name: Detect promoted Linux visual baselines
        id: linux_visual_baselines
        shell: bash
        run: |
          if compgen -G 'e2e/visual-regression.spec.ts-snapshots/*-linux.png' >/dev/null; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Linux visual baselines are not promoted yet; run Visual Baselines (Linux).'
          fi
      - name: Validate promoted Linux visual baseline contract
        if: steps.linux_visual_baselines.outputs.available == 'true'
        run: npm run test:visual:linux:contract
      - name: Run promoted Linux visual gate
        if: steps.linux_visual_baselines.outputs.available == 'true'
        run: npx playwright test e2e/visual-regression.spec.ts --project=chromium --project=mobile-chrome
        env:
          PLAYWRIGHT_USE_PREVIEW: '1'
      - name: Assemble release-facing reports after browser validation
        run: |
          npm run release:status
          npm run release:package
          npm run reviewer:kit
          npm run audit:worldclass
          node scripts/copy-legacy-assets.mjs
          npm run audit:public-artifacts -- --root dist/reports
      - name: Preserve the browser-validated Pages candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-validated-pages-candidate
          path: |
            dist/
            reports/
            package.json
          if-no-files-found: error
          retention-days: 2

  cross-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-node-project
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: npm run validate:cross
      - run: npm run validate:sympy
      - run: npm run validate:literature
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scipy-validation-evidence
          path: |
            reports/cross-validation.json
            reports/literature-anchors.json
          if-no-files-found: error

  julia-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-node-project
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2
        with:
          version: '1.10.11'
      - run: julia --project=julia -e 'using Pkg; Pkg.instantiate()'
      - run: npm run validate:julia
        env:
          JULIA_REQUIRED: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: julia-validation-evidence
          path: reports/julia-comparison.json
          if-no-files-found: error

  independent-validation-scope:
    needs: [cross-validate, julia-reference]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-node-project
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scipy-validation-evidence
          path: reports
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: julia-validation-evidence
          path: reports
      - run: npm run validate:reference
      - run: npm run validate:scope:refresh
      - run: npm run validate:scope
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: independent-validation-scope
          path: |
            reports/cross-validation.json
            reports/literature-anchors.json
            reports/julia-comparison.json
            reports/independent-validation-scope.json
          if-no-files-found: error
          retention-days: 90

  os-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            install_args: chromium
          - os: macos-latest
            platform: darwin
            install_args: chromium
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-node-project
      - run: npx playwright install ${{ matrix.install_args }}
      - run: npm run smoke
      # Native visual comparisons must exercise the same production artifact
      # and preview server as the Linux mainline gate. A dev-server snapshot
      # can otherwise be green while the deployed bundle regresses.
      - name: Build production app for native visual gate
        run: npm run build
      - name: Require the native visual-baseline contract
        run: node scripts/check-visual-baselines.mjs --platform=${{ matrix.platform }} --projects=chromium,mobile-chrome
      - name: Run the native visual regression gate
        run: npx playwright test e2e/visual-regression.spec.ts --project=chromium --project=mobile-chrome
        env:
          PLAYWRIGHT_USE_PREVIEW: '1'

  finalize-pages-artifact:
    needs:
      - science-and-build
      - browser-and-release-validation
      - cross-validate
      - julia-reference
      - independent-validation-scope
      - os-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-project
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: browser-validated-pages-candidate
          path: validated
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: independent-validation-scope
          path: fresh-independent-scope
      - name: Assemble and fingerprint the exact Pages payload
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -s validated/dist/index.html

          mkdir -p validated/reports validated/dist/reports
          for report_name in cross-validation.json literature-anchors.json julia-comparison.json independent-validation-scope.json; do
            report_path="$(find fresh-independent-scope -type f -name "$report_name" -print -quit)"
            test -n "$report_path"
            install -m 0644 "$report_path" "validated/reports/$report_name"
            install -m 0644 "$report_path" "validated/dist/reports/$report_name"
          done

          PENDULUM_EVIDENCE_CI_ARTIFACT=1 \
          PENDULUM_EVIDENCE_SOURCE_COMMIT="$SOURCE_SHA" \
          PENDULUM_EVIDENCE_REPORT_ROOT=validated \
          PENDULUM_EVIDENCE_OUTPUT=validated/dist/reports/evidence-summary.json \
          PENDULUM_EVIDENCE_PACKAGE_JSON=validated/package.json \
          PENDULUM_EVIDENCE_LOCKFILE=package-lock.json \
            npm run evidence:refresh

          PENDULUM_EVIDENCE_BINDING_SUMMARY=validated/dist/reports/evidence-summary.json \
          PENDULUM_EVIDENCE_BINDING_ROOT=validated/dist \
          PENDULUM_EVIDENCE_CI_ARTIFACT=1 \
            npm run evidence:bindings
          PENDULUM_CLAIM_EVIDENCE=validated/dist/reports/evidence-summary.json \
            npm run claims:check

          rm -f validated/dist/deployment-files.sha256 validated/dist/deployment-manifest.json
          (
            cd validated/dist
            find . -type f \
              ! -name deployment-files.sha256 \
              ! -name deployment-manifest.json \
              -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > deployment-files.sha256
            test -s deployment-files.sha256
            sha256sum --check deployment-files.sha256
          )

          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFile, writeFile } from 'node:fs/promises';

          const root = 'validated/dist';
          const sourceCommit = process.env.SOURCE_SHA ?? '';
          if (!/^[0-9a-f]{40}$/.test(sourceCommit)) throw new Error('SOURCE_SHA must be a full lowercase Git SHA');

          const sha256 = (bytes) => createHash('sha256').update(bytes).digest('hex');
          const inventory = await readFile(`${root}/deployment-files.sha256`);
          const entrypoint = await readFile(`${root}/index.html`);
          const evidence = JSON.parse(await readFile(`${root}/reports/evidence-summary.json`, 'utf8'));
          const evidenceSourceCommit = evidence?.provenance?.sourceCommit ?? '';
          if (!/^[0-9a-f]{40}$/.test(evidenceSourceCommit)) {
            throw new Error('deployed evidence sourceCommit must be a full lowercase Git SHA');
          }
          if (evidenceSourceCommit !== sourceCommit) {
            throw new Error('deployed evidence sourceCommit must equal the validated source commit');
          }
          if (evidence?.provenance?.dirtyWorktree !== false) {
            throw new Error('refusing to deploy evidence generated from a dirty worktree');
          }
          const evidenceExpiry = Date.parse(evidence?.provenance?.expiresAt ?? '');
          if (!Number.isFinite(evidenceExpiry) || evidenceExpiry <= Date.now()) {
            throw new Error('refusing to deploy expired evidence');
          }

          const fileCount = inventory.toString('utf8').trim().split('\n').filter(Boolean).length;
          const manifest = {
            schemaVersion: 'pendulum-pages-deployment/v1',
            sourceCommit,
            evidenceSourceCommit,
            sourceRef: process.env.GITHUB_REF ?? '',
            workflowRunId: process.env.GITHUB_RUN_ID ?? '',
            generatedAt: new Date().toISOString(),
            entrypoint: { path: 'index.html', sha256: sha256(entrypoint) },
            fileInventory: {
              path: 'deployment-files.sha256',
              sha256: sha256(inventory),
              fileCount
            }
          };
          await writeFile(`${root}/deployment-manifest.json`, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
      - name: Publish the final validated Pages artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mainline-validated-build
          path: validated/
          if-no-files-found: error
          retention-days: 2
