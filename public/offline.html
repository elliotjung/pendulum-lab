<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Pendulum Lab — Offline recovery</title>
  </head>
  <body>
    <main>
      <h1>Pendulum Lab is offline</h1>
      <p>
        This route is not available in the local cache yet. Your saved browser data has not been deleted. Reconnect,
        then retry the workspace.
      </p>
      <form action="./app.html" method="get">
        <button type="submit">Retry the Lab</button>
      </form>
      <p lang="ko">이 경로는 아직 오프라인 캐시에 없습니다. 저장된 브라우저 데이터는 삭제되지 않았습니다.</p>
    </main>
  </body>
</html>
